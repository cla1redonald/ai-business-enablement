name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the demo (self-test, observations check, facts, workbook, report check, pack)
        run: ./demo.sh

      - name: Regenerated facts.json must match the committed file
        run: |
          python3 tools/facts.py fixtures/caldergate/workspace
          git diff --exit-code -- fixtures/caldergate/workspace/facts.json
