<!doctype html>
<!-- TEMPLATE: waves. A wave is a group of moves that wait on nothing outside the group. Wave one: open now. Keep chips to about six per wave or the row wraps. --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#20262B;--accent:#2F4B6E;--grey:#7A848D;--pale:#E4E7EA;--paper:#FAFAF8}
*{box-sizing:border-box;margin:0}
body{width:1400px;height:400px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--ink);padding:44px 70px;position:relative}
.spine{position:absolute;left:70px;right:70px;top:104px;height:3px;background:var(--pale)}
.spine .fill{position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--pale))}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;position:relative}
.node{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:38px 0 14px}
.w2 .node{background:var(--accent)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.when{font-size:16px;font-weight:700;margin-top:2px}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;background:var(--paper);border:1px solid var(--pale)}
.w2 .chip{border-color:var(--accent)}
</style></head><body>
<div class="spine"><div class="fill"></div></div>
<div class="cols">
<div class="w1"><div class="node">1</div><div class="lbl">Wave one</div><div class="when">Open now</div><div class="chips"><span class="chip">{wave-one move}</span><span class="chip">{wave-one move}</span><span class="chip">{wave-one move}</span></div></div>
<div class="w2"><div class="node">2</div><div class="lbl">Wave two</div><div class="when">{what wave two is}</div><div class="chips"><span class="chip">{wave-two move}</span><span class="chip">{wave-two move}</span><span class="chip">{wave-two move}</span></div></div>
<div class="w1"><div class="node">3</div><div class="lbl">Wave three</div><div class="when">Builds on both</div><div class="chips"><span class="chip">{wave-three move}</span><span class="chip">{wave-three move}</span><span class="chip">{wave-three move}</span></div></div>
</div>
</body></html>
